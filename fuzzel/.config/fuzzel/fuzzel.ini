# ==============================================================================
# FUZZEL CONFIGURATION
# Theme: Catppuccin Mocha (Dark Modern)
# Context: Hyprland / Arch Linux
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MAIN SETTINGS
# ------------------------------------------------------------------------------
[main]
# Font: Using the same nerd font as your terminal for consistency
font=JetBrainsMono Nerd Font:size=12
# Icon theme: Ensure you have a nice icon theme installed (e.g., Papirus-Dark)
icon-theme=Papirus-Dark
# Enable bold text for better visibility
icons-enabled=yes

# Layout
# Center the launcher on the screen? (yes/no)
# If using a tiling WM like Hyprland, 'no' usually spawns it at the cursor or top-left,
# but 'yes' (centered overlay) often looks cleaner.
anchor=center
lines=10
width=40
horizontal-pad=20
vertical-pad=20
inner-pad=10

# Spacing between the icon and the text
image-size_ratio=0.5

# Blur settings (requires a compositor that supports blur, like Hyprland)
# This usually only works if the background color has transparency.
# layer=overlay

# ------------------------------------------------------------------------------
# 2. COLORS (Catppuccin Mocha Palette)
# ------------------------------------------------------------------------------
# Fuzzel uses RRGGBBAA (Red, Green, Blue, Alpha) format.
[colors]
# Background: Base color (#1e1e2e) with some transparency (dd = ~87%)
background=1e1e2edd

# Text: Text color (#cdd6f4) - fully opaque
text=cdd6f4ff

# Prompt: Subtext color (#a6adc8)
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff

# Selection: Surface2 (#585b70) - The bar highlighting the selected item
selection=585b70ff

# Selection Text: Text inside the selection bar
selection-text=cdd6f4ff

# Border: Mauve (#cba6f7) - Matches the modern pastel aesthetic
border=cba6f7ff

# Match: Pink (#f5c2e7) - Highlights the characters you typed
match=f5c2e7ff

# Selection Match: How the typed characters look inside the selection bar
selection-match=f5c2e7ff

# ------------------------------------------------------------------------------
# 3. BORDER & VISUALS
# ------------------------------------------------------------------------------
[border]
width=2
radius=10

# ------------------------------------------------------------------------------
# 4. DYNAMICS
# ------------------------------------------------------------------------------
[dmenu]
# If you run scripts that use dmenu mode, this helps identify them
mode=text  # text | index
exit-immediately-if-empty=yes